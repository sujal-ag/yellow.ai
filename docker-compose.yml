services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dispatcher
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    # All times are stored and compared in UTC.
    command: ["--default-time-zone=+00:00"]
    ports:
      - "3306:3306"
    volumes:
      # Applied only on first start (empty data volume).
      - ./service/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.2
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
